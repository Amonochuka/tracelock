version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tracelock_db
    environment:
      POSTGRES_USER: tracelock
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: tracelock
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
